<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Study design: record, auditor, LLM agent, recipient">
  <title>Study design</title>
  <rect x="0" y="0" width="900" height="250" rx="18" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f2937">
    <!-- 1 record -->
    <rect x="20" y="40" width="180" height="150" rx="14" fill="#eef4fb" stroke="#2a7fd4" stroke-width="2"/>
    <text x="110" y="70" font-size="17" font-weight="bold" text-anchor="middle">① Health record</text>
    <text x="110" y="100" font-size="13" text-anchor="middle">synthetic person</text>
    <text x="110" y="120" font-size="13" text-anchor="middle">with drug misuse</text>
    <text x="110" y="140" font-size="13" text-anchor="middle">(the attribute to protect)</text>
    <text x="110" y="160" font-size="13" text-anchor="middle">+ other conditions</text>
    <!-- 2 auditor -->
    <rect x="240" y="40" width="190" height="150" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="335" y="70" font-size="17" font-weight="bold" text-anchor="middle">② Auditor</text>
    <circle cx="262" cy="98" r="6" fill="#2a7fd4"/><text x="276" y="103" font-size="13">mask the label</text>
    <rect x="256" y="117" width="12" height="12" fill="#e8622c"/><text x="276" y="128" font-size="13">+ coarsen (literature)</text>
    <path d="M262 141 L269 154 L255 154 z" fill="#1a9e77"/><text x="276" y="153" font-size="13">+ coarsen (data-driven)</text>
    <text x="335" y="178" font-size="12" fill="#6b7280" text-anchor="middle">what the auditor knows</text>
    <!-- 3 agent -->
    <rect x="470" y="40" width="180" height="150" rx="14" fill="#f5f0ff" stroke="#7c4dcc" stroke-width="2"/>
    <text x="560" y="70" font-size="17" font-weight="bold" text-anchor="middle">③ LLM agent</text>
    <text x="560" y="100" font-size="13" text-anchor="middle">answers an employer's</text>
    <text x="560" y="120" font-size="13" text-anchor="middle">yearly questions</text>
    <text x="560" y="140" font-size="13" text-anchor="middle">from the audited record</text>
    <!-- 4 recipient -->
    <rect x="690" y="40" width="190" height="150" rx="14" fill="#fff3ec" stroke="#e8622c" stroke-width="2"/>
    <text x="785" y="70" font-size="17" font-weight="bold" text-anchor="middle">④ Recipient</text>
    <text x="785" y="100" font-size="13" text-anchor="middle">knows age &amp; sex,</text>
    <text x="785" y="120" font-size="13" text-anchor="middle">the overall rate, or</text>
    <text x="785" y="140" font-size="13" text-anchor="middle">rates by condition</text>
    <text x="785" y="170" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">→ flags drug misuse?</text>
    <!-- arrows -->
    <line x1="200" y1="115" x2="236" y2="115" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="430" y1="115" x2="466" y2="115" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="650" y1="115" x2="686" y2="115" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="450" y="225" font-size="13" fill="#4b5563" text-anchor="middle">Leakage = recipient's gain in balanced accuracy after reading, measured by an LLM attacker (answers) and a classifier (audited record)</text>
  </g>
</svg>
